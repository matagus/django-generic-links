name: Sync Github labels

on:
  push:
    branches:
      - main
    paths:
      - ".github/**"

permissions:
  contents: read
  issues: write

jobs:
  labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Upsert labels from .github/labels.toml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/sync_labels.py
